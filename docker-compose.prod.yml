services:
  web:
    build:
      context: .
      dockerfile: compose/prod/web/Dockerfile
    env_file: .env 
    environment:
      - DEBUG=False
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  nginx:
    build:
      context: .
      dockerfile: compose/prod/nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

volumes:
  static_volume:
  media_volume: